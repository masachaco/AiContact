name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Engine, headless host, example instruments and the skill CLI, on Linux and Windows.
  core-and-skill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          # LLVM (clang + wasm-ld) ships with the Windows runner image.
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          echo "PYTHON=python" >> "$GITHUB_ENV"
      - name: clang can target wasm32
        run: clang --version && clang --print-targets | grep wasm32
      - name: SDK copies in the skill are in sync
        run: |
          cmp sdk/c/aci.h skill/aicontact/sdk/aci.h && cmp sdk/web/aci-bridge.js skill/aicontact/sdk/aci-bridge.js
          ! LC_ALL=C grep -n '[^[:print:][:space:]]' sdk/web/aci-bridge.js  # must stay ASCII (JUCE Linux web view)
      - name: Build headless host
        run: |
          cmake -S . -B build -DAICONTACT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 4
          host=build/aicontact-host
          [ -f build/Release/aicontact-host.exe ] && host=build/Release/aicontact-host.exe
          echo "HOST_BIN=$PWD/$host" >> "$GITHUB_ENV"
      - name: Install wasmtime (only used to assemble the WAT example)
        run: python -m pip install wasmtime
      - name: Build example instruments and validate them
        run: |
          ./examples/build.sh
          for f in examples/prebuilt/*.wasm; do "$HOST_BIN" validate "$f" --no-sweep > /dev/null && echo "ok $f"; done
          "$HOST_BIN" render examples/prebuilt/supersaw.aci.wasm -o supersaw.wav
      - name: Skill CLI end-to-end test
        run: python tests/test_cli_e2e.py "$HOST_BIN"

  # The plugin itself (VST3 + Standalone, AU on macOS), loaded once in a JUCE VST3 host.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev
          libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libxcomposite-dev libgl1-mesa-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: WebView2 SDK (Windows, statically linked for HTML instrument UIs)
        if: runner.os == 'Windows'
        run: |
          dir="$(cygpath -m "$RUNNER_TEMP")/webview2"
          mkdir -p "$dir/Microsoft.Web.WebView2"
          curl -sSfL https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2 -o "$dir/webview2.zip"
          unzip -q "$dir/webview2.zip" -d "$dir/Microsoft.Web.WebView2"
          echo "WEBVIEW2_ARGS=-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$dir" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAICONTACT_BUILD_PLUGIN_TEST=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" $WEBVIEW2_ARGS | tee configure.log
          grep -q "HTML instrument UIs ON" configure.log  # release builds must support HTML UIs
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Load the VST3 in a test host
        run: |
          exe=$(find build/tests/plugin_host -type f \( -name 'aicontact_plugin_test' -o -name 'aicontact_plugin_test.exe' \) | head -1)
          "$exe" "build/plugin/AIContact_artefacts/Release/VST3/AI Contact.vst3" 2
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp -R "build/plugin/AIContact_artefacts/Release/VST3/AI Contact.vst3" dist/
          cp -R build/plugin/AIContact_artefacts/Release/Standalone dist/
          [ -d build/plugin/AIContact_artefacts/Release/AU ] && cp -R "build/plugin/AIContact_artefacts/Release/AU/AI Contact.component" dist/
          for f in build/aicontact-host build/Release/aicontact-host.exe; do [ -f "$f" ] && cp "$f" dist/; done
          ls -R dist | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: AIContact-${{ runner.os }}
          path: dist

  # Pushing a tag like v0.1.0 publishes a GitHub Release with one zip per OS plus the skill.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-and-skill, plugin]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p release
          for d in artifacts/AIContact-*; do (cd "$d" && zip -qr "../../release/$(basename "$d")-${GITHUB_REF_NAME}.zip" .); done
          (cd skill && zip -qr "../release/aicontact-skill-${GITHUB_REF_NAME}.zip" aicontact)
          ls -l release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "AI Contact $GITHUB_REF_NAME" --generate-notes
